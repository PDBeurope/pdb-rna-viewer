<!DOCTYPE html>
<html>

  <head>

    <style>
        #pdb-rna-viewer {
          width: 500px;
          height: 500px;
        }
        #mainMenu {
          width: 502px;
        }
    </style>
    <!-- PDB RNA Viewer CSS -->
    <link rel="stylesheet" type="text/css" href="build/pdb-rna-viewer-0.3.0-beta.css">

  </head>

  <body>
    <h4>PDB RNA Viewer Plugin Demo</h4>
    
    <!-- PDB RNA Viewer container -->
    <div id="pdb-rna-viewer" style="float: left;"></div>
    
    <!-- PDB RNA Viewer JS -->
    <script type="text/javascript" src="build/pdb-rna-viewer-plugin-0.3.0-beta.js"></script>
    <script>
        //Create plugin instance
        const pluginInstance = new PdbRnaViewerPlugin();

        //Get element from HTML/Template to place the view
        const viewContainer = document.getElementById('pdb-rna-viewer');

        const options = {
          pdbId: '1y26',
          entityId: '1',
          chainId: 'X',
          subscribeEvents: true        } 
    
        //Call render method to display the 2D view
        pluginInstance.render(viewContainer, options);
      
    </script>
  </body>

</html>
